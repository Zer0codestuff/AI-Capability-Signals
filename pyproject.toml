[project]
name = "ai-capability-signals"
version = "4.0.0"
description = "Traceable data for an accessible story about AI progress."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
